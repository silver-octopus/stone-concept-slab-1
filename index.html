document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"b6f3046f-a092-4c5a-9dfb-0496844cf74c\"><\u002Fscript>\n<\u002Fhead>\n<body>\n\n<x-dc>\n<helmet>\n<style>/* Stone Concept webfonts.\n   Headings are specified as Wotfard Regular (400-500). Wotfard is a licensed\n   Atipo Foundry family and no binaries were supplied, so --font-display names\n   Wotfard first and falls back to the system UI sans until the .woff2 files are\n   uploaded. No substitute family is loaded in its place.\n   Body type is Source Sans 3, available on Google Fonts. */\n@import url(\"5eb9fb23-bbd1-4754-ae19-da1773edbfee\");\n\n:root{\n  --font-display:\"Wotfard\",-apple-system,BlinkMacSystemFont,\"Segoe UI\",system-ui,sans-serif;\n  --font-body:\"Source Sans 3\",-apple-system,\"Segoe UI\",sans-serif;\n  --font-mono:ui-monospace,\"SFMono-Regular\",Menlo,monospace;\n}\n<\u002Fstyle>\n<style>:root{\n  /* --- Base palette: primary (quarry green) --- */\n  --green-900:#0F2117;\n  --green-800:#142C1F;\n  --green-700:#1B3A29;\n  --green-600:#27503A;\n  --green-500:#3A6B4F;\n  --green-200:#C6D4CB;\n  --green-100:#E8EDE9;\n  --green-50:#F4F7F5;\n\n  /* --- Base palette: warm stone neutrals --- */\n  --stone-0:#FFFFFF;\n  --stone-50:#FAF9F7;\n  --stone-100:#F2F0EC;\n  --stone-200:#E4E0D9;\n  --stone-300:#CFC9BF;\n  --stone-400:#ADA69A;\n  --stone-500:#8A8377;\n  --stone-600:#6B655B;\n  --stone-700:#4E4941;\n  --stone-800:#33302B;\n  --stone-900:#1C1A17;\n\n  /* --- Base palette: accent (brass veining) --- */\n  --brass-700:#8A6C3E;\n  --brass-500:#B08D57;\n  --brass-200:#E6DAC6;\n  --brass-100:#F5EEE3;\n\n  /* --- Base palette: semantic hues --- */\n  --success-600:#2F6B45;\n  --success-100:#E9F1EC;\n  --warning-600:#A9761C;\n  --warning-100:#F8F0DF;\n  --danger-600:#9B2C22;\n  --danger-100:#F7E9E7;\n  --info-600:#2A5570;\n  --info-100:#E8EFF4;\n\n  /* --- Semantic aliases: surfaces --- */\n  --surface-page:var(--stone-0);\n  --surface-raised:var(--stone-0);\n  --surface-sunken:var(--stone-50);\n  --surface-muted:var(--stone-100);\n  --surface-card:var(--stone-0);\n  --surface-inverse:var(--green-700);\n  --surface-inverse-deep:var(--stone-900);\n  --surface-accent:var(--green-50);\n  --surface-overlay:rgba(28,26,23,0.56);\n\n  /* --- Semantic aliases: text --- */\n  --text-heading:var(--green-700);\n  --text-body:var(--stone-800);\n  --text-muted:var(--stone-600);\n  --text-subtle:var(--stone-500);\n  --text-inverse:var(--stone-0);\n  --text-inverse-muted:rgba(255,255,255,0.72);\n  --text-accent:var(--brass-700);\n  --text-link:var(--green-700);\n  --text-link-hover:var(--green-900);\n\n  /* --- Semantic aliases: lines --- */\n  --line-hairline:var(--stone-200);\n  --line-strong:var(--stone-300);\n  --line-inverse:rgba(255,255,255,0.20);\n  --line-focus:var(--green-700);\n\n  /* --- Semantic aliases: interactive --- */\n  --action-primary-bg:var(--green-700);\n  --action-primary-bg-hover:var(--green-800);\n  --action-primary-bg-active:var(--green-900);\n  --action-primary-fg:var(--stone-0);\n  --action-secondary-bg:transparent;\n  --action-secondary-bg-hover:var(--green-50);\n  --action-secondary-fg:var(--green-700);\n  --action-ghost-bg-hover:var(--stone-100);\n  --action-disabled-bg:var(--stone-200);\n  --action-disabled-fg:var(--stone-500);\n\n  /* --- Semantic aliases: status --- */\n  --status-success-fg:var(--success-600);\n  --status-success-bg:var(--success-100);\n  --status-warning-fg:var(--warning-600);\n  --status-warning-bg:var(--warning-100);\n  --status-danger-fg:var(--danger-600);\n  --status-danger-bg:var(--danger-100);\n  --status-info-fg:var(--info-600);\n  --status-info-bg:var(--info-100);\n}\n<\u002Fstyle>\n<style>:root{\n  /* Sizes. Headings live in 32-40px on desktop; body is 16px. */\n  --text-display:40px;\n  --text-h1:40px;\n  --text-h2:32px;\n  --text-h3:24px;\n  --text-h4:20px;\n  --text-lead:18px;\n  --text-base:16px;\n  --text-sm:14px;\n  --text-xs:12px;\n  --text-label:12px;\n\n  --leading-tight:1.15;\n  --leading-heading:1.2;\n  --leading-snug:1.35;\n  --leading-body:1.6;\n  --leading-loose:1.75;\n\n  --weight-regular:400;\n  --weight-medium:500;\n  --weight-semibold:600;\n\n  --tracking-display:-0.01em;\n  --tracking-normal:0;\n  --tracking-wide:0.06em;\n  --tracking-label:0.14em;\n\n  /* Semantic type roles */\n  --type-display:var(--weight-regular) var(--text-display)/var(--leading-tight) var(--font-display);\n  --type-h1:var(--weight-regular) var(--text-h1)/var(--leading-tight) var(--font-display);\n  --type-h2:var(--weight-regular) var(--text-h2)/var(--leading-heading) var(--font-display);\n  --type-h3:var(--weight-medium) var(--text-h3)/var(--leading-snug) var(--font-display);\n  --type-h4:var(--weight-medium) var(--text-h4)/var(--leading-snug) var(--font-display);\n  --type-lead:var(--weight-regular) var(--text-lead)/var(--leading-loose) var(--font-body);\n  --type-body:var(--weight-regular) var(--text-base)/var(--leading-body) var(--font-body);\n  --type-body-sm:var(--weight-regular) var(--text-sm)/var(--leading-body) var(--font-body);\n  --type-label:var(--weight-semibold) var(--text-label)/1.4 var(--font-body);\n  --type-button:var(--weight-semibold) var(--text-sm)/1 var(--font-body);\n}\n<\u002Fstyle>\n<style>:root{\n  --space-0:0;\n  --space-1:2px;\n  --space-2:4px;\n  --space-3:8px;\n  --space-4:12px;\n  --space-5:16px;\n  --space-6:24px;\n  --space-7:32px;\n  --space-8:48px;\n  --space-9:64px;\n  --space-10:96px;\n  --space-11:128px;\n\n  /* Layout */\n  --container-max:1240px;\n  --container-narrow:760px;\n  --gutter:24px;\n  --gutter-lg:48px;\n  --section-y:96px;\n  --section-y-sm:64px;\n  --grid-columns:12; /* @kind other */\n  --header-height:76px;\n}\n<\u002Fstyle>\n<style>:root{\n  /* Stone Concept is a square-cornered system. Radius 0 is the rule, not a default. */\n  --radius-none:0;\n  --radius-pill:999px; /* only for a status dot or a scrollbar thumb */\n\n  --border-width-hairlin g);transition:var(--transition-color)}\na:hover{color:var(--text-link-hover);border-bottom-color:var(--green-700)}\nimg{display:block;max-width:100%}\n::selection{background:var(--green-100);color:var(--green-900)}\n:focus-visible{outline:none;box-shadow:var(--shadow-focus)}\n.sc-label{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-subtle)}\n.sc-container{max-width:var(--container-max);margin:0 auto;padding:0 var(--gutter)}\n\n<\u002Fstyle>\n<script src=\"8295385c-8725-4e3d-8761-5b053aa389bf\"><\u002Fscript>\n<style>\n  body { margin: 0; background: var(--stone-0); }\n  @keyframes sc-spin { to { transform: rotate(360deg); } }\n  input[type=\"number\"] { -moz-appearance: textfield; appearance: textfield; }\n  input[type=\"number\"]::-webkit-outer-spin-button,\n  input[type=\"number\"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }\n  .sc-num:focus { outline: none; box-shadow: inset 0 0 0 2px var(--green-700); }\n  a { color: var(--text-link); text-decoration-color: var(--stone-300); }\n  a:hover { color: var(--text-link-hover); text-decoration-color: var(--green-700); }\n  @media (max-width: 1080px) {\n    .sc-two-col { grid-template-columns: 1fr !important; }\n    .sc-sticky { position: static !important; }\n    .sc-fields { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)) !important; }\n    .sc-strip { grid-template-columns: 176px minmax(180px, 1fr) minmax(220px, 1.4fr) !important; }\n  }\n  @media (max-width: 1080px) {\n    .sc-stone-grid { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }\n    .sc-item-row { grid-template-columns: 240px minmax(0, 1fr) !important; }\n  }\n  @media (max-width: 640px) {\n    .sc-stone-grid { grid-template-columns: 1fr !important; padding: var(--space-5) !important; }\n    .sc-picker-shell { max-height: 100% !important; }\n    .sc-picker-overlay { padding: 0 !important; }\n    .sc-viewer-body { grid-template-columns: 1fr !important; }\n    .sc-editor-grid { grid-template-columns: 1fr !important; }\n    .sc-strip { grid-template-columns: 1fr !important; }\n    .sc-item-row { grid-template-columns: 1fr !important; }\n  }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"font: var(--type-body); color: var(--text-body); text-wrap: pretty; min-height: 100vh; display: flex; flex-direction: column\">\n\n  <header style=\"position: sticky; top: 0; z-index: 20; height: var(--header-height); background: var(--stone-0); border-bottom: 1px solid var(--line-hairline); display: flex; align-items: center\">\n    <div style=\"width: 100%; max-width: var(--container-max); margin: 0 auto; padding: 0 var(--gutter); display: flex; align-items: center; justify-content: space-between; gap: var(--space-6)\">\n      <div style=\"display: flex; align-items: baseline; gap: var(--space-6)\">\n        <span style=\"font: var(--type-h4); color: var(--text-heading); letter-spacing: 0.01em\">Stone Concept<\u002Fspan>\n        <span style=\"font: var(--type-label); letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--text-muted)\">Szabáskalkulátor<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: flex; align-items: center; gap: var(--space-6)\">\n        <a href=\"#\" style=\"font: var(--type-body-sm); text-decoration: none\">Vissza a kollekcióhoz<\u002Fa>\n        <span style=\"font: var(--type-body-sm); color: var(--text-muted)\">+36 1 234 5678<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <main style=\"width: 100%; max-width: var(--container-max); margin: 0 auto; padding: var(--space-8) var(--gutter) var(--space-10); flex: 1\">\n\n    <section style=\"margin-bottom: var(--space-8); padding-bottom: var(--space-8); border-bottom: 1px solid var(--line-hairline)\">\n      <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-5); margin-bottom: var(--space-5)\">\n        <h2 style=\"font: var(--type-h3); color: var(--text-heading); margin: 0\">Mit jelentenek a fogalmak?<\u002Fh2>\n        <span style=\"font: var(--type-body-sm); color: var(--text-subtle)\">Metszeti vázlatok<\u002Fspan>\n      <\u002Fdiv>\n\n      <div class=\"sc-fields\" style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-5)\">\n\n        <article style=\"border: 1px solid var(--line-hairline); background: var(--surface-card); display: flex; flex-direction: column\">\n          <div style=\"background: var(--stone-100); border-bottom: 1px solid var(--line-hairline); padding: var(--space-4)\">\n            <svg sc-camel-view-box=\"0 0 200 110\" style=\"display: block; width: 100%; height: auto\" role=\"img\" aria-label=\"Fózolt élű kő metszete\">\n              <path d=\"M20 40 H150 L170 60 V80 H20 Z\" fill=\"var(--stone-300)\" stroke=\"var(--stone-700)\" stroke-width=\"1.5\"><\u002Fpath>\n              <path d=\"M150 40 L170 60\" stroke=\"var(--green-700)\" stroke-width=\"3\"><\u002Fpath>\n              <path d=\"M138 26 L162 50\" stroke=\"var(--stone-700)\" stroke-width=\"1\" stroke-dasharray=\"3 3\"><\u002Fpath>\n              <text x=\"166\" y=\"24\" font-family=\"system-ui\" font-size=\"12\" fill=\"var(--text-muted)\" text-anchor=\"end\">45°<\u002Ftext>\n            <\u002Fsvg>\n          <\u002Fdiv>\n          <div style=\"padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-2)\">\n            <h3 style=\"font: var(--type-h4); color: var(--text-heading); margin: 0\">Fózolás és élcsiszolás<\u002Fh3>\n            <p style=\"font: var(--type-body-sm); color: var(--text-muted); margin: 0\">A fózolás a látszó él letörése 45 fokban, az élcsiszolás a felület polírozása. A kettő együtt az élmegmunkálás: a gyártásban csak együtt kérhető, és egy oldalon a felső és az alsó él mindig együtt készül.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Farticle>\n\n        <article style=\"border: 1px solid var(--line-hairline); background: var(--surface-card); display: flex; flex-direction: column\">\n          <div style=\"background: var(--stone-100); border-bottom: 1px solid var(--line-hairline); padding: var(--space-4)\">\n            <svg sc-camel-view-box=\"0 0 200 110\" style=\"display: block; width: 100%; height: auto\" role=\"img\" aria-label=\"Vízorr horony a kő alján\">\n              <path d=\"M20 40 H175 V70 H150 V62 H135 V70 H20 Z\" fill=\"var(--stone-300)\" stroke=\"var(--stone-700)\" stroke-width=\"1.5\"><\u002Fpath>\n              <path d=\"M142 74 V90\" stroke=\"var(--green-700)\" stroke-width=\"1.5\"><\u002Fpath>\n              <path d=\"M138 84 L142 92 L146 84\" fill=\"none\" stroke=\"var(--green-700)\" stroke-width=\"1.5\"><\u002Fpath>\n              <path d=\"M175 40 V70\" stroke=\"var(--stone-700)\" stroke-width=\"1.5\"><\u002Fpath>\n            <\u002Fsvg>\n          <\u002Fdiv>\n          <div style=\"padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-2)\">\n            <h3 style=\"font: var(--type-h4); color: var(--text-heading); margin: 0\">Vízorr<\u002Fh3>\n            <p style=\"font: var(--type-body-sm); color: var(--text-muted); margin: 0\">A kő alsó lapjába vágott horony az él közelében. A lefolyó víz itt leszakad, így nem fut vissza a homlokzatra. Vízorros lap kültéri, vízorr nélkül beltéri.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Farticle>\n\n        <article style=\"border: 1px solid var(--line-hairline); background: var(--surface-card); display: flex; flex-direction: column\">\n          <div style=\"background: var(--stone-100); border-bottom: 1px solid var(--line-hairline); padding: var(--space-4)\">\n            <svg sc-camel-view-box=\"0 0 200 110\" style=\"display: block; width: 100%; height: auto\" role=\"img\" aria-label=\"Párkány, fedkő és lépcső elhelyezésének metszete\">\n              <rect x=\"14\" y=\"40\" width=\"34\" height=\"60\" fill=\"var(--stone-200)\" stroke=\"var(--stone-700)\" stroke-width=\"1.5\"><\u002Frect>\n              <path d=\"M14 40 H60 V52 H14 Z\" fill=\"var(--stone-300)\" stroke=\"var(--green-700)\" stroke-width=\"1.5\"><\u002Fpath>\n              <text x=\"37\" y=\"30\" font-family=\"system-ui\" font-size=\"11\" fill=\"var(--text-muted)\" text-anchor=\"middle\">párkány<\u002Ftext>\n              <rect x=\"82\" y=\"52\" width=\"34\" height=\"48\" fill=\"var(--stone-200)\" stroke=\"var(--stone-700)\" stroke-width=\"1.5\"><\u002Frect>\n              <path d=\"M74 40 H124 V52 H74 Z\" fill=\"var(--stone-300)\" stroke=\"var(--green-700)\" stroke-width=\"1.5\"><\u002Fpath>\n              <text x=\"99\" y=\"30\" font-family=\"system-ui\" font-size=\"11\" fill=\"var(--text-muted)\" text-anchor=\"middle\">fedkő<\u002Ftext>\n              <rect x=\"152\" y=\"70\" width=\"34\" height=\"30\" fill=\"var(--stone-200)\" stroke=\"var(--stone-700)\" stroke-width=\"1.5\"><\u002Frect>\n              <path d=\"M144 58 H190 V70 H144 Z\" fill=\"var(--stone-300)\" stroke=\"var(--green-700)\" stroke-width=\"1.5\"><\u002Fpath>\n              <rect x=\"160\" y=\"40\" width=\"30\" height=\"18\" fill=\"var(--stone-200)\" stroke=\"var(--stone-700)\" stroke-width=\"1.5\"><\u002Frect>\n              <text x=\"167\" y=\"30\" font-family=\"system-ui\" font-size=\"11\" fill=\"var(--text-muted)\" text-anchor=\"middle\">lépcső<\u002Ftext>\n            <\u002Fsvg>\n          <\u002Fdiv>\n          <div style=\"padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-2)\">\n            <h3 style=\"font: var(--type-h4); color: var(--text-heading); margin: 0\">Párkány, fedkő, lépcső<\u002Fh3>\n            <p style=\"font: var(--type-body-sm); color: var(--text-muted); margin: 0\">A párkány a nyílás alá kerül: elöl teljes hosszban, oldalt fix 3 cm-en megmunkált, vízorr csak elöl kérhető. A fedkő a fal vagy kerítés tetejét zárja le: minden oldala megmunkálható, és bármelyikre kérhető vízorr. A lépcső járófelület: minden oldala megmunkálható, vízorr nélkül.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Farticle>\n\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <div style=\"max-width: 760px; display: flex; flex-direction: column; gap: var(--space-4); margin-bottom: var(--space-8)\">\n      <h1 style=\"font: var(--type-h1); letter-spacing: var(--tracking-display); color: var(--text-heading); margin: 0\">Párkány és fedkő méretre szabva<\u002Fh1>\n      <p style=\"font: var(--type-lead); color: var(--text-muted); margin: 0\">Válasszon kőtípust, adja meg a méreteket, és a kalkulátor kiírja a nettó árat. Nagyobb tételre árajánlatot is kérhet.<\u002Fp>\n    <\u002Fdiv>\n\n    <section style=\"border-top: 1px solid var(--line-hairline); padding-top: var(--space-6)\">\n      <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-5); margin-bottom: var(--space-5)\">\n        <h2 style=\"font: var(--type-h3); color: var(--text-heading); margin: 0\">Tételek<\u002Fh2>\n        <span style=\"font: var(--type-body-sm); color: var(--text-subtle)\">Nettó árak, 2026-os lista · példaadatok<\u002Fspan>\n      <\u002Fdiv>\n\n      <div class=\"sc-two-col\" style=\"display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: var(--space-6); align-items: start\">\n\n        <div style=\"display: flex; flex-direction: column; gap: var(--space-5); min-width: 0\">\n          <sc-for list=\"{{ items }}\" as=\"it\" hint-placeholder-count=\"1\">\n            <article class=\"sc-item-row\" style=\"display: grid; grid-template-columns: 420px minmax(0, 1fr); border: 1px solid var(--line-hairline); background: var(--surface-card)\">\n\n              <button type=\"button\" sc-camel-on-click=\"{{ it.onPickStone }}\" style=\"{{ it.thumbStyle }}\">\n                <span style=\"position: absolute; left: var(--space-4); top: var(--space-4); right: var(--space-4); background: var(--stone-0); border: 1px solid var(--line-hairline); padding: 4px 8px; display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3); font: var(--type-
